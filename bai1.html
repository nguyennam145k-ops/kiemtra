<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>trung bình cộng số lẻ ở vị trí chắn trong mảng</title>
</head>
<body>
    

<script>
function Avg(){
            let a=prompt("nhap chuoi so cach nhau bang dau phay")
            let arr=a.split(",").map(Number)
            let sum=0
            let count=0
            for (i=0;i<arr.length;i++){
                if(i%2==0 && arr[i]%2==1){
                    sum=sum+arr[i];
                    count++;
                }
            }
            let avg = sum/count;
            document.write(avg.toFixed(2));
        }
        Avg()
</script>
</body>
</html>
